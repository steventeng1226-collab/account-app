<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#080c14">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="流水帳">
<title>流水帳統計中心</title>
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">

<style>
:root {
  --bg: #080c14;
  --bg2: #0f172a;
  --bg3: #1e293b;
  --border: #1e3a8a30;
  --border2: #374151;
  --accent: #3b82f6;
  --accent2: #1d4ed8;
  --text: #e2e8f0;
  --text2: #94a3b8;
  --text3: #64748b;
  --green: #22c55e;
  --red: #ef4444;
  --yellow: #f59e0b;
  --card-bg: #0f172a;
  --tab-h: 52px;
  --header-h: 52px;
}

* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

html, body {
  height: 100%;
  background: var(--bg);
  color: var(--text);
  font-family: 'Noto Sans TC', sans-serif;
  font-size: 13px;
  overflow: hidden;
  -webkit-text-size-adjust: 100%;
  text-size-adjust: 100%;
}

/* ── Header ── */
#header {
  position: fixed; top: 0; left: 0; right: 0;
  height: var(--header-h);
  background: linear-gradient(135deg, #0f172a, #1a2540);
  border-bottom: 1px solid var(--border);
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 14px;
  z-index: 300;
}
#header .logo { display: flex; align-items: center; gap: 8px; }
#header .logo span { font-size: 20px; }
#header h1 { font-size: 14px; font-weight: 700; color: var(--text); letter-spacing: .3px; white-space: nowrap; }
#header .ver {
  font-size: 8px; line-height: 1; color: #60a5fa; background: #1e3a5f;
  border: 1px solid #2563eb44; border-radius: 20px;
  padding: 0 5px; font-weight: 600; white-space: nowrap;
  height: 12px; display: inline-flex; align-items: center;
  -webkit-text-size-adjust: 100%; text-size-adjust: 100%;
  max-width: none; flex-shrink: 0;
  transform: scale(0.75); transform-origin: left center;
}


/* ── Tabs ── */
#tabs {
  position: fixed;
  top: var(--header-h); left: 0; right: 0;
  height: var(--tab-h);
  background: var(--bg2);
  border-bottom: 1px solid var(--border);
  display: flex; align-items: center;
  padding: 6px 8px; gap: 4px;
  z-index: 99; overflow-x: auto;
}
#tabs::-webkit-scrollbar { display: none; }
.tab-btn {
  flex: 1; min-width: 64px;
  background: none; border: none;
  color: var(--text3); font-size: 11px; font-weight: 500;
  padding: 6px 4px; border-radius: 7px;
  cursor: pointer; white-space: nowrap;
  font-family: 'Noto Sans TC', sans-serif;
  transition: all .2s;
}
.tab-btn.active {
  background: var(--bg3); color: var(--text);
  font-weight: 700;
  border-bottom: 2px solid var(--accent);
}

/* ── Content ── */
#content {
  position: fixed;
  top: calc(var(--header-h) + var(--tab-h));
  left: 0; right: 0; bottom: 0;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
}
.page { display: none; padding: 12px 10px 80px; }
.page.active { display: block; }

/* ── Cards ── */
.stat-row {
  display: grid; grid-template-columns: 1fr 1fr;
  gap: 8px; margin-bottom: 10px;
}
.stat-card {
  background: var(--card-bg);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 10px 12px;
}
.stat-card.wide { grid-column: span 2; }
.stat-lbl { font-size: 9px; color: var(--text3); font-weight: 600; text-transform: uppercase; letter-spacing: .4px; margin-bottom: 4px; }
.stat-val { font-size: 18px; font-weight: 700; color: var(--text); font-family: 'DM Mono', monospace; }
.stat-val.sm { font-size: 14px; }

/* ── Banner ── */
.m-banner {
  background: linear-gradient(135deg, #0f172a, #1e293b);
  border: 1px solid var(--border);
  border-radius: 8px; padding: 7px 12px;
  margin-bottom: 10px;
  font-size: 12px; color: #60a5fa; font-weight: 700;
}

/* ── Est bar ── */
.est-bar {
  background: #0f2444; border: 1px solid #1e3a8a;
  border-radius: 6px; padding: 6px 10px;
  font-size: 11px; color: #93c5fd;
  margin-bottom: 10px;
}

/* ── Chart container ── */
.chart-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 10px; }
.chart-box {
  background: var(--card-bg); border: 1px solid var(--border);
  border-radius: 10px; padding: 8px;
  position: relative; overflow: hidden;
  height: 180px;
}
.chart-title { font-size: 10px; color: var(--text2); font-weight: 600; margin-bottom: 6px; text-align: center; }
canvas { width: 100% !important; }

/* ── Table ── */
.rank-table { width: 100%; border-collapse: collapse; font-size: 11px; }
.rank-table th { color: var(--text3); font-size: 9px; text-transform: uppercase; padding: 4px 6px; text-align: left; border-bottom: 1px solid var(--border2); }
.rank-table td { color: var(--text); padding: 5px 6px; border-bottom: 1px solid #1f293730; }
.rank-table tr:last-child td { border-bottom: none; }
.rank-table .num { text-align: right; font-family: 'DM Mono', monospace; }
.rank-table .pct { text-align: right; color: #60a5fa; font-family: 'DM Mono', monospace; }

/* ── List ── */
.list-filter {
  display: flex; gap: 6px; margin-bottom: 10px;
  overflow-x: auto; padding-bottom: 4px;
}
.list-filter::-webkit-scrollbar { display: none; }
.filter-btn {
  flex: 0 0 auto;
  background: var(--bg3); border: 1px solid var(--border2);
  color: var(--text2); border-radius: 20px;
  padding: 4px 12px; font-size: 11px; cursor: pointer;
  font-family: 'Noto Sans TC', sans-serif;
  transition: all .2s;
}
.filter-btn.active { background: var(--accent); border-color: var(--accent); color: #fff; }

.list-item { overflow: hidden;
  background: var(--card-bg); border: 1px solid var(--border);
  border-radius: 9px; padding: 10px 12px;
  margin-bottom: 7px;
  display: grid; grid-template-columns: 1fr auto;
  gap: 2px 8px;
}
.list-item .date { font-size: 10px; color: var(--text3); }
.list-item .name { font-size: 13px; font-weight: 600; color: var(--text); }
.list-item .cat { 
  display: inline-block; font-size: 9px; 
  background: var(--bg3); border-radius: 4px;
  padding: 1px 6px; color: var(--text2); margin-top: 2px;
}
.list-item .amt {
  font-size: 16px; font-weight: 700; font-family: 'DM Mono', monospace;
  color: var(--text); text-align: right;
}
.list-item .pay { font-size: 10px; color: var(--text3); text-align: right; }
.list-caption { font-size: 10px; color: var(--text3); text-align: center; padding: 8px 0; }

/* ── 清單：按日分組的緊湊列 ── */
.day-group { background: var(--card-bg); border: 1px solid var(--border); border-radius: 10px; margin-bottom: 6px; overflow: hidden; }
.day-head { display: flex; justify-content: space-between; align-items: center; padding: 3px 12px; background: #16213a; font-size: 11px; line-height: 1.4; font-weight: 600; color: #93c5fd; }
.day-sum { font-family: 'DM Mono', monospace; color: #cbd5e1; }
.list-row { display: flex; align-items: center; gap: 10px; padding: 5px 12px; border-top: 1px solid #1f293780; cursor: pointer; min-height: 40px; }
.list-row:active { background: #1e293b; }
.lr-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
.lr-main { flex: 1; min-width: 0; }
.lr-name { font-size: 13px; line-height: 1.3; font-weight: 600; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.lr-meta { font-size: 10px; line-height: 1.3; color: var(--text3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 1px; }
.lr-right { text-align: right; flex-shrink: 0; }
.lr-amt { font-size: 15px; line-height: 1.25; font-weight: 700; font-family: 'DM Mono', monospace; color: var(--text); }
.lr-orig { font-size: 9.5px; line-height: 1.2; color: var(--text3); font-family: 'DM Mono', monospace; }
.lr-warn { color: #f87171; margin-right: 6px; }
.lr-wait { color: #fbbf24; margin-right: 6px; }
.list-sum-bar { background: #0f2444; border: 1px solid #1e3a8a; border-radius: 8px; padding: 8px 12px; margin: 0 0 8px; display: flex; justify-content: space-between; align-items: center; }

/* ── 記帳：金額換算提示、常用項目 ── */
.amt-hint { font-size: 11px; color: #93c5fd; min-height: 15px; margin-top: 3px; text-align: right; font-family: 'DM Mono', monospace; }
.quick-items { display: flex; gap: 6px; overflow-x: auto; margin-top: 8px; padding-bottom: 2px; }
.quick-items::-webkit-scrollbar { display: none; }
.quick-chip { flex: 0 0 auto; display: inline-flex; align-items: center; gap: 5px; background: var(--bg3); border: 1px solid var(--border2); color: var(--text2); border-radius: 20px; padding: 5px 11px; font-size: 12px; font-family: 'Noto Sans TC', sans-serif; cursor: pointer; white-space: nowrap; }
.quick-chip:active { background: var(--accent2); color: #fff; }

/* ── 未寫入提示列 ── */
#pending-bar { display: none; position: fixed; left: 0; right: 0; top: calc(var(--header-h) + var(--tab-h)); height: 36px; z-index: 98; background: #450a0a; border-bottom: 1px solid #ef4444; color: #fecaca; font-size: 12px; align-items: center; gap: 8px; padding: 0 12px; }
body.has-pending #pending-bar { display: flex; }
body.has-pending #content { top: calc(var(--header-h) + var(--tab-h) + 36px); }
body.has-pending #page-monthly.active, body.has-pending #page-total.active { height: calc(100vh - 140px); }
#pending-bar .pb-msg { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#pending-bar button { flex-shrink: 0; border-radius: 6px; padding: 4px 10px; font-size: 12px; font-family: 'Noto Sans TC', sans-serif; cursor: pointer; }
#pending-bar .pb-retry { background: #ef4444; border: none; color: #fff; font-weight: 700; }
#pending-bar .pb-drop { background: transparent; border: 1px solid #7f1d1d; color: #fca5a5; }

/* ── Form ── */
.form-section { margin-bottom: 14px; }
.form-label { font-size: 10px; color: #94a3b8; font-weight: 600; text-transform: uppercase; letter-spacing: .4px; margin-bottom: 6px; display: block; }
.form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }

input[type="date"], input[type="number"], input[type="text"], textarea {
  width: 100%; background: var(--bg3);
  border: 1px solid var(--border2); border-radius: 8px;
  color: #ffffff; font-size: 14px;
  padding: 10px 12px; outline: none;
  font-family: 'Noto Sans TC', sans-serif;
  -webkit-appearance: none;
}
input[type="date"]::-webkit-calendar-picker-indicator { filter: invert(1); }
input::placeholder, textarea::placeholder { color: #64748b !important; }
input[type="number"] { color: #ffffff !important; }
select { color: #ffffff !important; }
input[type="date"]:focus, input[type="number"]:focus,
input[type="text"]:focus, textarea:focus {
  border-color: var(--accent);
}
textarea { resize: none; height: 64px; }

/* ── Pills ── */
.pills { display: flex; flex-wrap: wrap; gap: 6px; }
.pill {
  background: var(--bg3); border: 1px solid var(--border2);
  color: var(--text2); border-radius: 7px;
  padding: 6px 12px; font-size: 12px;
  cursor: pointer; font-family: 'Noto Sans TC', sans-serif;
  transition: all .15s; user-select: none;
}
.pill.selected { background: var(--accent2); border-color: var(--accent); color: #fff; font-weight: 600; }
.pill.unselected-warn { border-color: var(--red); }

/* ── TWD Preview ── */
.twd-preview {
  background: #0f2444; border: 1px solid #1e3a8a;
  border-radius: 8px; padding: 8px 12px;
  font-size: 12px; color: #93c5fd;
  margin-bottom: 12px;
}
.twd-preview strong { color: #f1f5f9; font-size: 18px; font-family: 'DM Mono', monospace; }

/* ── Buttons ── */
.btn-row { display: grid; grid-template-columns: 2fr 1fr; gap: 8px; }
.btn-primary {
  background: var(--accent); border: none;
  color: #fff; border-radius: 9px;
  padding: 13px; font-size: 14px; font-weight: 700;
  cursor: pointer; font-family: 'Noto Sans TC', sans-serif;
  transition: background .2s; width: 100%;
}
.btn-primary:active { background: var(--accent2); }
.btn-secondary {
  background: var(--bg3); border: 1px solid var(--border2);
  color: var(--text2); border-radius: 9px;
  padding: 13px; font-size: 13px;
  cursor: pointer; font-family: 'Noto Sans TC', sans-serif;
  width: 100%;
}

/* ── Toast ── */
#toast {
  position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
  background: #1e293b; border: 1px solid var(--border2);
  border-radius: 10px; padding: 10px 20px;
  font-size: 13px; color: var(--text);
  z-index: 999; opacity: 0; pointer-events: none;
  transition: opacity .3s; white-space: nowrap;
}
#toast.show { opacity: 1; }
#toast.ok { border-color: var(--green); color: var(--green); }
#toast.err { border-color: var(--red); color: var(--red); }

/* ── Loading ── */
.loading { text-align: center; padding: 40px 0; color: var(--text3); }
.spinner {
  width: 28px; height: 28px; border: 3px solid var(--border2);
  border-top-color: var(--accent); border-radius: 50%;
  animation: spin .8s linear infinite; margin: 0 auto 12px;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* ── Divider ── */
.divider { border: none; border-top: 1px solid var(--border2); margin: 12px 0; }

/* ── Section title ── */
.sec-title { font-size: 13px; font-weight: 700; color: #60a5fa; margin-bottom: 10px; }

/* ── Month selector ── */
.month-select {
  background: var(--bg3); border: 1px solid var(--border2);
  color: var(--text); border-radius: 8px;
  padding: 8px 10px; font-size: 13px;
  font-family: 'Noto Sans TC', sans-serif;
  width: 100%; margin-bottom: 10px; outline: none;
}


/* ── Autocomplete ── */
.autocomplete-wrap { position: relative; }
.autocomplete-list {
  position: fixed; left: 12px; right: 12px;
  background: #1e293b; border: 1px solid #3b82f6;
  border-radius: 12px; z-index: 9999;
  max-height: 260px; overflow-y: auto;
  box-shadow: 0 8px 32px #00000080;
}
.autocomplete-item {
  padding: 10px 12px; cursor: pointer;
  border-bottom: 1px solid #1f293740;
  display: flex; justify-content: space-between; align-items: center;
}
.autocomplete-item:last-child { border-bottom: none; }
.autocomplete-item:active { background: #2563eb; }
.autocomplete-item .ac-name { color: #e2e8f0; font-size: 13px; font-weight: 500; }
.autocomplete-item .ac-meta { color: #64748b; font-size: 10px; text-align: right; }
.autocomplete-item .ac-highlight { color: #60a5fa; }


/* ── Edit Modal ── */
.modal-overlay {
  position: fixed; inset: 0;
  background: #00000088; z-index: 500;
  display: flex; align-items: flex-end;
}
.modal-box {
  background: #0f172a; border: 1px solid #1e3a8a;
  border-radius: 16px 16px 0 0;
  width: 100%; padding: 16px 14px 0;
  max-height: 90vh; overflow-y: auto;
}
.modal-title {
  font-size: 15px; font-weight: 700; color: #e2e8f0;
  margin-bottom: 14px; display: flex; justify-content: space-between;
}
.modal-close {
  background: none; border: none; color: #64748b;
  font-size: 20px; cursor: pointer; padding: 0 4px;
}
.modal-actions {
  display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 14px;
  position: sticky; bottom: 0; z-index: 10;
  background: linear-gradient(to top, #0f172a 75%, transparent);
  padding: 10px 0 28px;
}
.btn-danger {
  background: #7f1d1d; border: 1px solid #ef4444;
  color: #fca5a5; border-radius: 9px;
  padding: 12px; font-size: 13px; font-weight: 600;
  cursor: pointer; font-family: 'Noto Sans TC', sans-serif; width: 100%;
}

/* ── Empty state ── */
.empty { text-align: center; padding: 40px 0; color: var(--text3); font-size: 13px; }

/* ── 代墊分頁 ── */
.reimburse-header { padding: 16px 16px 0; }
.reimburse-summary { display: flex; gap: 12px; margin-bottom: 14px; }
.rs-card { flex: 1; border-radius: 12px; padding: 14px 12px; text-align: center; }
.rs-card.unpaid { background: linear-gradient(135deg, #7c3aed22, #7c3aed44); border: 1px solid #7c3aed66; }
.rs-card.paid   { background: linear-gradient(135deg, #05966922, #05966944); border: 1px solid #05966966; }
.rs-label { font-size: 12px; color: #94a3b8; margin-bottom: 4px; }
.rs-amt   { font-size: 18px; font-weight: 700; color: #ffffff; }
.rs-count { font-size: 11px; color: #64748b; margin-top: 2px; }
.reimburse-filter { display: flex; gap: 8px; margin-bottom: 12px; }
.rf-btn { flex: 1; padding: 8px; border-radius: 8px; border: 1px solid #334155;
  background: transparent; color: #94a3b8; font-size: 13px; cursor: pointer; }
.rf-btn.active { background: #2563eb; border-color: #2563eb; color: #fff; font-weight: 600; }
.reimburse-list { padding: 0 16px 80px; }
.reimburse-item { display: flex; align-items: center; gap: 12px;
  background: #1e293b; border-radius: 12px; padding: 14px 12px; margin-bottom: 10px;
  border: 1px solid #334155; transition: opacity .3s; }
.reimburse-item.is-paid { opacity: 0.55; }
.reimburse-check { position: relative; width: 24px; height: 24px; flex-shrink: 0; cursor: pointer; }
.reimburse-check input { opacity: 0; width: 0; height: 0; position: absolute; }
.checkmark { position: absolute; inset: 0; border-radius: 6px;
  border: 2px solid #475569; background: #0f172a; transition: all .2s; }
.reimburse-check input:checked ~ .checkmark {
  background: #059669; border-color: #059669; }
.checkmark:after { content: '✓'; position: absolute; top: 50%; left: 50%;
  transform: translate(-50%,-50%); color: #fff; font-size: 13px; font-weight: 700;
  display: none; }
.reimburse-check input:checked ~ .checkmark:after { display: block; }
.reimburse-info { flex: 1; min-width: 0; }
.ri-date { font-size: 11px; color: #94a3b8; margin-bottom: 2px; }
.ri-name { font-size: 14px; font-weight: 600; color: #e2e8f0;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ri-paid-name { text-decoration: line-through; color: #64748b; }
.ri-meta { font-size: 11px; color: #94a3b8; margin-top: 3px; }
.reimburse-amt { text-align: right; flex-shrink: 0; }
.ri-orig { font-size: 14px; font-weight: 700; color: #ffffff; }
.ri-twd { font-size: 12px; color: #cbd5e1; margin-top: 1px; }
.rs-cur { font-size: 13px; color: #ffffff; margin-top: 3px; font-weight: 600; }
.ri-paid-badge { font-size: 10px; color: #059669; margin-top: 3px; font-weight: 600; }


/* ── 收據上傳 ── */
.upload-area {
  border: 2px dashed #334155; border-radius: 12px;
  padding: 20px; text-align: center; cursor: pointer;
  background: #0f172a; transition: border-color .2s;
}
.upload-area:active { border-color: #3b82f6; }
.upload-icon { font-size: 28px; margin-bottom: 6px; }
.upload-hint { font-size: 13px; color: #e2e8f0; font-weight: 600; }
.upload-sub  { font-size: 11px; color: #64748b; margin-top: 3px; }
.file-preview-inner { display: flex; align-items: center; gap: 10px;
  background: #1e293b; border-radius: 10px; padding: 10px 12px; margin-top: 8px; }
.preview-name { flex: 1; font-size: 12px; color: #94a3b8;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.remove-file-btn { background: #ef444420; border: 1px solid #ef444450;
  color: #ef4444; border-radius: 6px; padding: 4px 10px; font-size: 11px; cursor: pointer; flex-shrink: 0; }
.progress-bar { height: 6px; background: #1e293b; border-radius: 3px; margin-top: 10px; overflow: hidden; }
.progress-fill { height: 100%; background: #3b82f6; border-radius: 3px;
  width: 0%; transition: width .3s; }
.progress-text { font-size: 11px; color: #64748b; margin-top: 5px; text-align: center; }


/* ── 提交按鈕固定底部 ── */
.sticky-submit {
  position: fixed;
  bottom: 0; left: 0; right: 0;
  padding: 10px 16px 20px;
  background: linear-gradient(to top, #0f172a 70%, transparent);
  z-index: 100;
}


/* ── 全期一頁版面 ── */
#page-total.active { display: flex; flex-direction: column; height: calc(100vh - 104px); overflow: hidden; padding: 8px 12px 6px; }
.total-onepage { display: flex; flex-direction: column; height: 100%; gap: 8px; }

/* ── 當月一頁版面 ── */
#page-monthly.active { display: flex; flex-direction: column; height: calc(100vh - 100px); overflow: hidden; padding: 8px 12px 4px; }
.monthly-onepage { display: flex; flex-direction: column; height: 100%; gap: 6px; }

.mo-top { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
.month-select-sm { background: #1e293b; color: #e2e8f0; border: 1px solid #334155;
  border-radius: 8px; padding: 5px 10px; font-size: 13px; flex: 1; }
.mo-prog { font-size: 12px; color: #60a5fa; font-weight: 600; white-space: nowrap; }

.mo-cards { display: grid; grid-template-columns: 1fr 1fr 1fr 1fr; gap: 6px; flex-shrink: 0; }
.mo-card { background: #1e293b; border-radius: 10px; padding: 8px 6px; text-align: center;
  border: 1px solid #334155; }
.mo-card.co { border-color: #92400e; background: #1a1200; }
.mo-card.est { border-color: #1e3a5f; background: #0c1a2e; }
.mo-card-lbl { font-size: 9px; color: #64748b; margin-bottom: 3px; line-height: 1.2; }
.mo-card-val { font-size: 13px; font-weight: 700; color: #f1f5f9; }
.mo-card-val.co { color: #fbbf24; }
.mo-card-val.est { color: #60a5fa; }

.mo-charts { display: flex; gap: 6px; flex: 1 1 170px; min-height: 150px; max-height: 250px; }
.mo-chart-canvas { flex: 1; min-height: 0; position: relative; }
.mo-chart-box { flex: 1; background: #1e293b; border-radius: 10px; padding: 6px;
  border: 1px solid #334155; display: flex; flex-direction: column; min-height: 0; }
.mo-chart-title { font-size: 10px; color: #64748b; text-align: center; margin-bottom: 2px; flex-shrink: 0; }
.mo-chart-box canvas { flex: 1; min-height: 0; }

.mo-rank { flex: 0 1 auto; overflow-y: auto; min-height: 0; }
.rank-table-sm { width: 100%; border-collapse: collapse; font-size: 11px; }
.rank-table-sm th { color: #64748b; font-weight: 600; padding: 3px 4px;
  border-bottom: 1px solid #1f2937; text-align: left; position: sticky; top: 0; background: #0f172a; }
.rank-table-sm td { color: #e2e8f0; padding: 4px 4px; border-bottom: 1px solid #1f293720; }
.rank-table-sm .num { text-align: right; font-variant-numeric: tabular-nums; }
.rank-table-sm .pct { text-align: right; color: #60a5fa; width: 42px; }
.rank-table-sm .diff { text-align: right; width: 76px; font-variant-numeric: tabular-nums; white-space: nowrap; }
.rank-table-sm tr.sum td { font-weight: 700; border-top: 1px solid #334155; }
.rank-table-sm .up { color: #f87171; }
.rank-table-sm .down { color: #4ade80; }


/* ── 清單搜尋 ── */
.list-search-wrap {
  position: relative; margin: 8px 16px 4px; flex-shrink: 0;
}
.list-search-input {
  width: 100%; padding: 10px 36px 10px 14px;
  background: #1e293b; border: 1px solid #334155;
  border-radius: 10px; color: #e2e8f0; font-size: 13px;
  box-sizing: border-box;
}
.list-search-input:focus { outline: none; border-color: #3b82f6; }
.list-search-clear {
  position: absolute; right: 10px; top: 50%; transform: translateY(-50%);
  background: none; border: none; color: #64748b; font-size: 14px; cursor: pointer; padding: 4px;
}


/* ── AI 辨識 ── */
.ai-scan-btn {
  background: linear-gradient(135deg, #6366f1, #8b5cf6);
  border: none; border-radius: 8px; color: #fff;
  padding: 8px 12px; font-size: 12px; font-weight: 600;
  cursor: pointer; white-space: nowrap; flex-shrink: 0;
}
.ai-scan-btn:active { opacity: 0.8; }
.ai-result-card {
  background: #1e293b; border: 1px solid #6366f1;
  border-radius: 10px; padding: 10px 12px; margin-top: 8px;
  font-size: 12px;
}

.ai-result-label { color: #64748b; }

<script>
// ════════════════════════════════════
//  設定
// ════════════════════════════════════
const VERSION    = 'v5.8.2';
const SHEET_ID   = '1lOCs8X7fzhApCoKBIp35OogqbF2Y-VVVCF3hS19q6d4';
const GID        = '259728202';
const CSV_URL    = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/export?format=csv&gid=${GID}`;
const WEBHOOK    = 'https://script.google.com/macros/s/AKfycbxuzqCQMr2cR0-xnmaP8hWZSTOIVZ41nbD4QdDC0pycbw2qHUdjUAG8185sjkhD4RBY/exec';
let GEMINI_KEY = localStorage.getItem('gemini_key') || '';
let OPENAI_KEY = localStorage.getItem('openai_key') || '';
let VND_RATE   = 0.00128; // 預設值，啟動後自動更新

const CO_KEYS    = ['公司代墊'];

const PASTEL     = ['#7ec8e3','#f9c784','#a8d8a8','#f9a8d4','#c4b5fd','#fdba74','#86efac','#fda4af','#93c5fd','#fcd34d'];
// 類別固定配色：同一類別在圓餅、清單、排行表都是同一個顏色
const CAT_COLOR  = {
  '固定':'#7ec8e3', '越南固定':'#f9c784', '保險、稅':'#a8d8a8', '食':'#f9a8d4', '樂':'#c4b5fd', '住':'#fdba74',

};
function catColor(c) { return CAT_COLOR[c] || '#64748b'; }
function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));

async function fetchExchangeRate() {
  const rateEl = document.getElementById('rate-badge');

  async function tryFetch(url, extract) {
    const ctrl = new AbortController();
    const t = setTimeout(() => ctrl.abort(), 4000);
    try {
      const res = await fetch(url, { signal: ctrl.signal });
      clearTimeout(t);
      const data = await res.json();
      return extract(data);
    } catch(e) { clearTimeout(t); return null; }
  }

  // API 1: exchangerate-api
  let rate = await tryFetch(
    'https://open.er-api.com/v6/latest/TWD',
    d => d.rates && d.rates.VND
  );
  // API 2: frankfurter
  if (!rate) rate = await tryFetch(
    'https://api.frankfurter.dev/v1/latest?from=TWD&to=VND',
    d => d.rates && d.rates.VND
  );
  // API 3: fawazahmed0 via jsdelivr (完全免費無限制)
  if (!rate) rate = await tryFetch(
    'https://cdn.jsdelivr.net/npm/@fawazahmed0/currency-api@latest/v1/currencies/twd.json',
    d => d.twd && d.twd.vnd
  );

  if (rate) {
    VND_RATE = 1 / rate;
    if (rateEl) rateEl.textContent = `1 TWD ≈ ${Math.round(rate)} VND`;
  } else {
    VND_RATE = 1 / 1200;
    if (rateEl) rateEl.textContent = '1 TWD ≈ 1,200 VND（預設）';
  }

  // 同時抓 USD -> TWD
  let usdRate = await tryFetch(
    'https://open.er-api.com/v6/latest/USD',
    d => d.rates && d.rates.TWD
  );
  if (!usdRate) usdRate = await tryFetch(
    'https://cdn.jsdelivr.net/npm/@fawazahmed0/currency-api@latest/v1/currencies/usd.json',
    d => d.usd && d.usd.twd
  );
  if (usdRate) USD_RATE = usdRate;
}

// ════════════════════════════════════
//  資料載入
// ════════════════════════════════════
async function loadData(force = false, quiet = false) {
  try {
    const res = await fetch(CSV_URL + '&t=' + Date.now());
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const text = await res.text();
    try { localStorage.setItem('cached_csv', text); } catch(e) {} // 快取供下次秒開
    allData = parseCSV(text);
    mergePending();
    renderQuickItems();
    return true;
  } catch(e) {
    if (!quiet) showToast('❌ 讀取失敗：' + e.message, 'err');
    return false;
  }
}

// ════════════════════════════════════
//  未寫入佇列：新記帳以「Sheets 真的出現這筆」為準，沒出現就保留並提示重送
// ════════════════════════════════════
let pendingTx = [];
try { pendingTx = JSON.parse(localStorage.getItem('pending_tx') || '[]') || []; } catch(e) { pendingTx = []; }

function savePending() {
  try {
    localStorage.setItem('pending_tx', JSON.stringify(pendingTx.map(p => ({ id: p.id, payload: p.payload, sig: p.sig, base: p.base, failed: !!p.failed }))));
  } catch(e) {}
}

// 比對用特徵：日期 + 金額 + 項目 + 類別
function txSig(dateStr, amt, name, cat) {
  const d = new Date(dateStr);
  return [d.getFullYear(), d.getMonth() + 1, d.getDate(), parseFloat(amt) || 0, String(name || '').trim(), cat || ''].join('|');
}
function countSig(sig) {
  return allData.filter(r => !r['__pending'] && txSig(r['日期'], r['金額'], getItemName(r), r['類別']) === sig).length;
}

function pendingRow(p) {
  const pl = p.payload, d = new Date(pl.date);
  return {
    '時間戳記': pl.timestamp, '__rawTimestamp': pl.timestamp,
    '日期': pl.date,
    '類別': pl.category,
    '項目名稱（簡述用途）': pl.item,
    '金額': String(pl.amount),
    '幣別': pl.currency,
    '支付方式': pl.payment,
    '備註（可選：詳細說明或特殊情況）': pl.note, '備註': pl.note,
    '收款狀態': '',
    '台幣金額': pl.twd, '__twdStored': true,
    '年月': `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`,
    '日': d.getDate(),
    '__sheetRow': p.id, '__pending': true, '__failed': !!p.failed,
  };
}

// 每次載入後呼叫：Sheets 已出現的從佇列移除，還沒出現的補回畫面
function mergePending() {
  allData = allData.filter(r => !r['__pending']);
  if (pendingTx.length) {
    const before = pendingTx.length;
    pendingTx = pendingTx.filter(p => countSig(p.sig) <= p.base);
    if (pendingTx.length !== before) savePending();
    pendingTx.forEach(p => allData.push(pendingRow(p)));
  }
  renderPendingBar();
}

function renderPendingBar() {
  const failed = pendingTx.filter(p => p.failed);
  const busy = pendingTx.some(p => p.failed && p.sending) || _retrying;
  document.body.classList.toggle('has-pending', failed.length > 0);
  const msg = document.getElementById('pending-msg');
  const btn = document.getElementById('pending-retry');
  if (msg) msg.textContent = busy ? `⏳ 重送中…（${failed.length} 筆）` : `⚠️ ${failed.length} 筆記帳尚未寫入 Sheets`;
  if (btn) btn.disabled = busy;
}

function queueTx(payload) {
  const sig = txSig(payload.date, payload.amount, payload.item, payload.category);
  const p = {
    id: Date.now(), payload, sig,
    base: countSig(sig) + pendingTx.filter(x => x.sig === sig).length,
    failed: false,
  };
  pendingTx.push(p);
  savePending();
  allData.push(pendingRow(p));
  sendTx(p);
}

async function sendTx(p, isRetry = false) {
  p.sending = true;
  renderPendingBar();
  if (navigator.onLine !== false) await submitViaForm(p.payload);
  // 分三次確認 Sheets 是否真的出現這筆
  for (const wait of [0, 3000, 6000]) {
    if (wait) await new Promise(r => setTimeout(r, wait));
    await loadData(false, true);
    if (!pendingTx.includes(p)) break;
  }
  p.sending = false;
  if (pendingTx.includes(p)) {
    p.failed = true;
    savePending();
    allData.forEach(r => { if (r['__pending'] && r['__sheetRow'] === p.id) r['__failed'] = true; });
    if (!isRetry) showToast('⚠️ 這筆尚未寫入 Sheets，已保留待重送', 'err');
  }
  renderPendingBar();
  renderCurrentTab();
}

let _retrying = false;
async function retryPending() {
  if (_retrying) return;
  _retrying = true;
  renderPendingBar();
  await loadData(false, true); // 先確認是否其實已寫入，避免重複
  for (const p of pendingTx.filter(x => x.failed && !x.sending)) {
    await sendTx(p, true);
  }
  _retrying = false;
  renderPendingBar();
  renderCurrentTab();
  const left = pendingTx.filter(x => x.failed).length;
  showToast(left ? `⚠️ 仍有 ${left} 筆未寫入` : '✅ 已全部寫入', left ? 'err' : 'ok');
}

function dropPending() {
  const failed = pendingTx.filter(p => p.failed);
  if (!failed.length) return;
  if (!confirm(`捨棄這 ${failed.length} 筆未寫入的記帳？`)) return;
  pendingTx = pendingTx.filter(p => !p.failed);
  savePending();
  mergePending();
  renderCurrentTab();
}

function parseCSV(text) {
  const lines = text.trim().split('\n');
  const headers = lines[0].split(',').map(h => h.replace(/"/g,'').trim());
  console.log('📋 欄位名稱:', headers);
  const rows = [];
  lines.slice(1).forEach((line, i) => {
    const vals = splitCSVLine(line);
    const row = {};
    headers.forEach((h, j) => row[h] = (vals[j] || '').replace(/"/g,'').trim());
    // 行號必須在 filter 前計算，否則跳過空行會造成偏移
    row['__sheetRow'] = i + 2; // Sheets 第1行是標題，所以資料從第2行開始
    row['__rawTimestamp'] = row['時間戳記'] || '';
    if (!row['日期']) return; // 跳過空行但行號已記錄
    // 計算台幣金額：優先用記帳當下寫入的台幣金額（J欄，匯率固定），否則用即時匯率換算
    const amt = parseFloat(row['金額']) || 0;
    const cur = row['幣別'] || '';
    // J 欄（第 10 欄，index 9）用「欄位位置」讀取，不靠標題名稱，避免標題重名或未設導致讀不到
    const storedTWD = parseFloat((vals[9] || '').replace(/"/g,'').trim()) || 0;
    row['__twdStored'] = storedTWD > 0;
    row['台幣金額'] = storedTWD > 0 ? Math.round(storedTWD)
      : cur.includes('VND') ? Math.round(amt * VND_RATE) : cur.includes('USD') ? Math.round(amt * USD_RATE) : Math.round(amt);
    // 年月
    const d = new Date(row['日期']);
    row['年月'] = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;
    row['日'] = d.getDate();
    rows.push(row);
  });
  return rows;
}

function splitCSVLine(line) {
  const result = []; let cur = ''; let inQ = false;
  for (let c of line) {
    if (c === '"') { inQ = !inQ; }
    else if (c === ',' && !inQ) { result.push(cur); cur = ''; }
    else { cur += c; }
  }
  result.push(cur);
  return result;
}

let currentTab = 'add';

function switchTab(tab) {
  document.querySelectorAll('.tab-btn').forEach((b,i) => {
    const tabs = ['monthly','total','list','add','reimburse'];
    b.classList.toggle('active', tabs[i] === tab);

}

// ════════════════════════════════════
//  當月分頁
// ════════════════════════════════════
let selectedMonth = '';

function renderMonthly() {
  const page = document.getElementById('page-monthly');
  if (!allData.length) { page.innerHTML = '<div class="empty">📭 尚無資料</div>'; return; }

  const months = [...new Set(allData.map(r => r['年月']))].filter(Boolean).sort().reverse();
  const today = new Date();
  const curYM = `${today.getFullYear()}-${String(today.getMonth()+1).padStart(2,'0')}`;
  // 預設當月，若當月無資料才用最近一個月
  if (!selectedMonth || !months.includes(selectedMonth)) {
    selectedMonth = months.includes(curYM) ? curYM : months[0];
  }
  const isCur = selectedMonth === curYM;

  const dfm = allData.filter(r => r['年月'] === selectedMonth);
  const [y, m] = selectedMonth.split('-').map(Number);
  const dim = new Date(y, m, 0).getDate();
  const tDay = isCur ? today.getDate() : dim;
  const pct = Math.round(tDay / dim * 100);
  const lbl = `${y}/${String(m).padStart(2,'0')}`;
  const prog = isCur ? `第 ${tDay}/${dim} 天（${pct}%）` : '完整月份';

  const coMask = r => CO_KEYS.includes(r['類別']||'');
  const coSum  = dfm.filter(coMask).reduce((s,r) => s + r['台幣金額'], 0);
  const meSum  = dfm.filter(r => !coMask(r)).reduce((s,r) => s + r['台幣金額'], 0);
  const total  = meSum;
  const dAvg   = tDay ? Math.round(meSum / tDay) : 0;

  // 本月預估：用今年度（不含本月）的月平均支出推算
  function getYearAvg() {
    const allMonths = [...new Set(allData.map(r => r['年月']))].filter(Boolean).sort().reverse();
    const yr = selectedMonth.split('-')[0];
    const prevMonths = allMonths.filter(mo => mo.startsWith(yr) && mo < selectedMonth);
    if (!prevMonths.length) return 0;
    const monthTotals = prevMonths.map(mo => {
      return allData
        .filter(r => r['年月'] === mo && !coMask(r))
        .reduce((s, r) => s + r['台幣金額'], 0);
    });
    return Math.round(monthTotals.reduce((a,b) => a+b, 0) / monthTotals.length);
  }
  const yearAvg = getYearAvg();
  // 有今年度資料就用今年月平均，否則用本月日均推算
  const est = isCur && tDay >= 3
    ? (yearAvg > 0 ? yearAvg : Math.round(meSum / tDay * dim))
    : 0;
  const estLabel = yearAvg > 0 ? '今年均值' : `日均 ${fmt(dAvg)} 推算`;

  // 類別加總（只算個人支出，排除公司代墊）
  const catMap = {};
  dfm.filter(r => !coMask(r)).forEach(r => { catMap[r['類別']] = (catMap[r['類別']]||0) + r['台幣金額']; });
  const catEntries = Object.entries(catMap).sort((a,b) => b[1]-a[1]);

  // 與上月比較（本月進行中 → 只比上月同期天數）
  const pd = new Date(y, m - 2, 1);
  const prevYM = `${pd.getFullYear()}-${String(pd.getMonth()+1).padStart(2,'0')}`;
  const hasPrev = allData.some(r => r['年月'] === prevYM);
  const prevCat = {};
  allData.filter(r => r['年月'] === prevYM && !coMask(r) && (!isCur || r['日'] <= tDay))
    .forEach(r => { prevCat[r['類別']] = (prevCat[r['類別']]||0) + r['台幣金額']; });
  const prevTotal = Object.values(prevCat).reduce((a,b) => a+b, 0);
  const cmpLabel = isCur ? '較上月同期' : '較上月';
  const rankRows = [...new Set([...Object.keys(catMap), ...Object.keys(prevCat)])]
    .map(cat => [cat, catMap[cat]||0, prevCat[cat]||0])
    .sort((a,b) => b[1]-a[1] || b[2]-a[2]);
  const diffCell = (cur, prev) => {
    const d = cur - prev;
    if (!hasPrev || d === 0) return '<span style="color:#475569">—</span>';
    return d > 0 ? `<span class="up">▲${fmt(d)}</span>` : `<span class="down">▼${fmt(-d)}</span>`;
  };

  // 累計走勢：本月個人支出逐日累計
  const days = Array.from({length: dim}, (_,i) => i+1);
  const perDay = {};
  dfm.filter(r => !coMask(r)).forEach(r => { perDay[r['日']] = (perDay[r['日']]||0) + r['台幣金額']; });
  let run = 0;
  const cumVals = days.map(d => { run += perDay[d]||0; return d <= tDay ? run : null; });

  // 對照線：今年其他月份（本月之前）的平均累計曲線
  const refMonths = months.filter(mo => mo.startsWith(String(y)) && mo < selectedMonth);
  let avgVals = null;
  if (refMonths.length) {
    const sums = new Array(dim).fill(0);
    refMonths.forEach(mo => {
      const pm = {};
      allData.filter(r => r['年月'] === mo && !coMask(r)).forEach(r => { pm[r['日']] = (pm[r['日']]||0) + r['台幣金額']; });
      let acc = 0;
      for (let d = 1; d <= 31; d++) { acc += pm[d]||0; if (d < dim) sums[d-1] += acc; }
      sums[dim-1] += acc; // 最後一天含對照月超出的天數
    });
    avgVals = sums.map(v => Math.round(v / refMonths.length));
  }

  // 月份選擇器
  const monthOpts = months.map(mo => {
    const [my,mm] = mo.split('-');
    return `<option value="${mo}" ${mo===selectedMonth?'selected':''}>${my}/${mm}</option>`;
  }).join('');

  page.innerHTML = `
    <div class="monthly-onepage">
      <!-- 頂部：月份 + 進度 -->
      <div class="mo-top">
        <select class="month-select-sm" onchange="selectedMonth=this.value;renderMonthly()">
          ${monthOpts}
        </select>
        <div class="mo-prog">${prog}</div>
      </div>

      <!-- 數字卡片列 -->
      <div class="mo-cards">
        <div class="mo-card">
          <div class="mo-card-lbl">💰 個人支出</div>
          <div class="mo-card-val">${fmt(meSum)}</div>
        </div>
        <div class="mo-card">
          <div class="mo-card-lbl">📆 日均</div>
          <div class="mo-card-val">${fmt(dAvg)}</div>
        </div>
        <div class="mo-card co">
          <div class="mo-card-lbl">🚩 代墊</div>
          <div class="mo-card-val co">${fmt(coSum)}</div>
        </div>
        <div class="mo-card est">
          <div class="mo-card-lbl">📈 預估</div>
          <div class="mo-card-val est">${isCur && tDay >= 3 ? fmt(est) : '--'}</div>
        </div>
      </div>

      <!-- 圖表列 -->
      <div class="mo-charts">
        <div class="mo-chart-box">
          <div class="mo-chart-title">類別佔比</div>
          <div class="mo-chart-canvas"><canvas id="chart-pie"></canvas></div>
        </div>
        <div class="mo-chart-box">
          <div class="mo-chart-title">累計走勢　<span style="color:#60a5fa">━ 本月</span>${avgVals ? '　<span style="color:#94a3b8">┄ 今年平均</span>' : ''}</div>
          <div class="mo-chart-canvas"><canvas id="chart-bar"></canvas></div>
        </div>
      </div>

      <!-- 類別排行（捲動區） -->
      <div class="mo-rank">
        <table class="rank-table-sm">
          <tr><th>類別</th><th class="num">TWD</th><th class="pct">%</th><th class="diff">${cmpLabel}</th></tr>
          ${rankRows.map(([cat, val, prev]) => `
            <tr>
              <td><span class="lr-dot" style="background:${catColor(cat)};margin-right:6px"></span>${esc(cat)}</td>
              <td class="num">${fmt(val)}</td>
              <td class="pct">${total ? (val/total*100).toFixed(1) : '0.0'}%</td>
              <td class="diff">${diffCell(val, prev)}</td>
            </tr>`).join('')}
          <tr class="sum">
            <td>合計</td>
            <td class="num">${fmt(total)}</td>
            <td class="pct"></td>
            <td class="diff">${diffCell(total, prevTotal)}</td>
          </tr>
        </table>
      </div>
    </div>
  `;

  // Charts
  setTimeout(() => {
    destroyChart('pie'); destroyChart('bar');
    const pieCtx = document.getElementById('chart-pie');
    const barCtx = document.getElementById('chart-bar');
    if (pieCtx && catEntries.length) {
      charts['pie'] = new Chart(pieCtx, {
        type: 'doughnut',
        data: {
          labels: catEntries.map(e=>e[0]),
          datasets: [{ data: catEntries.map(e=>e[1]), backgroundColor: catEntries.map(e=>catColor(e[0])), borderWidth: 0 }]
        },
        options: {
          cutout: '55%', plugins: { legend: { display: false } },
          responsive: true, maintainAspectRatio: false
        }
      });
    }
    if (barCtx && days.length) {
      const lineSets = [{
        label: '本月', data: cumVals,
        borderColor: '#3b82f6', backgroundColor: '#3b82f622', fill: true,
        borderWidth: 2, pointRadius: 0, pointHoverRadius: 4, tension: 0.15,
      }];
      if (avgVals) lineSets.push({
        label: '今年平均', data: avgVals,
        borderColor: '#94a3b8', borderDash: [4, 3], fill: false,
        borderWidth: 1.5, pointRadius: 0, pointHoverRadius: 4, tension: 0.15,
      });
      charts['bar'] = new Chart(barCtx, {
        type: 'line',
        data: { labels: days, datasets: lineSets },
        options: {
          interaction: { mode: 'index', intersect: false },
          plugins: {
            legend: { display: false },
            tooltip: { callbacks: {
              title: items => `${m}/${items[0].label}`,
              label: item => `${item.dataset.label} NT$ ${fmt(item.raw)}`
            } }
          },
          scales: {
            x: {
              ticks: {
                color: '#94a3b8',
                font: { size: 9 },
                maxRotation: 0, autoSkip: false,
                callback: function(val, idx) {
                  // 只顯示 1, 5, 10, 15, 20, 25, 30 日
                  const d = parseInt(days[idx]);
                  return [1,5,10,15,20,25,30].includes(d) ? d+'日' : '';
                }
              },
              grid: { color: '#1f293750' }
            },
            y: {
              beginAtZero: true,
              ticks: {
                color: '#94a3b8', font: { size: 9 },
                callback: v => v >= 1000 ? Math.round(v/1000)+'k' : v
              },
              grid: { color: '#1f293750' }
            }
          },
          responsive: true, maintainAspectRatio: false
        }
      });
    }
  }, 150);
}

// ════════════════════════════════════
//  清單分頁
// ════════════════════════════════════
let listFilter = '全部';
let listSearch = '';
let listLimit  = 100;      // 先畫 100 筆，捲到底再加
let _listObs   = null;
const WEEKDAY  = ['日','一','二','三','四','五','六'];

// 外框（月份按鈕、搜尋框）只在月份清單變動時重畫；打字搜尋只重畫清單本體
function renderList() {
  const page = document.getElementById('page-list');
  if (!allData.length) { page.innerHTML = '<div class="empty">📭 尚無資料</div>'; return; }

  const months = [...new Set(allData.map(r => r['年月']))].filter(Boolean).sort().reverse();
  if (listFilter !== '全部' && !months.includes(listFilter)) listFilter = '全部';
  const key = months.join(',');

  if (page.dataset.months !== key || !document.getElementById('list-body')) {
    const label = f => {
      if (f === '全部') return '全部';
      const [yy, mm] = f.split('-');
      const isFirstOfYear = months.filter(mo => mo.startsWith(yy))[0] === f;
      return isFirstOfYear ? yy + '|' + parseInt(mm) + '月' : parseInt(mm) + '月';
    };
    page.dataset.months = key;
    page.innerHTML = `
      <div class="list-filter" id="list-filter">${['全部', ...months].map(f =>
        `<button class="filter-btn" data-f="${f}" onclick="setListFilter('${f}')">${label(f)}</button>`).join('')}</div>
      <div class="list-search-wrap">
        <input type="text" class="list-search-input" id="list-search-inp" autocomplete="off"
          placeholder="🔍 搜尋項目、類別、備註..."
          oninput="setListSearch(this.value)">
        <button class="list-search-clear" id="list-search-clear" onclick="setListSearch('', true)" style="display:none">✕</button>
      </div>
      <div id="list-summary"></div>
      <div id="list-body"></div>
    `;
    document.getElementById('list-search-inp').value = listSearch;
  }
  renderListBody();
}

function setListFilter(f) {
  listFilter = f; listLimit = 100;
  document.getElementById('content').scrollTop = 0;
  renderListBody();
}

function setListSearch(v, clearInput) {
  listSearch = v; listLimit = 100;
  if (clearInput) { const inp = document.getElementById('list-search-inp'); if (inp) inp.value = ''; }
  renderListBody();
}

function listRowHTML(r) {
  const note = r['備註（可選：詳細說明或特殊情況）'] || r['備註'] || '';
  const hasReceipt = note.includes('res.cloudinary.com') || note.includes('drive.google.com/file');
  const noteTxt = note.replace(/📎 收據：https?:\/\/\S+/g, '').trim();
  const cur  = r['幣別'] || '';
  const code = cur.includes('VND') ? 'VND' : cur.includes('USD') ? 'USD' : '';
  const amt  = parseFloat(r['金額']) || 0;
  const meta = [r['類別'], r['支付方式'], noteTxt].filter(Boolean).map(esc).join(' · ');
  const flag = r['__pending']
    ? (r['__failed'] ? '<span class="lr-warn">⚠️ 未寫入</span>' : '<span class="lr-wait">⏳ 寫入中</span>')
    : '';
  const name = getItemName(r);
  return `<div class="list-row" data-row="${r['__sheetRow']}" onclick="openEditByRow(this)">
    <span class="lr-dot" style="background:${catColor(r['類別'])}"></span>
    <div class="lr-main">
      <div class="lr-name">${name ? esc(name) : '<span style="color:#64748b">（未命名）</span>'}${hasReceipt ? ' 📎' : ''}</div>
      <div class="lr-meta">${flag}${meta}</div>
    </div>
    <div class="lr-right">
      <div class="lr-amt">${fmt(r['台幣金額'])}</div>
      ${code ? `<div class="lr-orig">${amt.toLocaleString('en-US')} ${code}</div>` : ''}
    </div>
  </div>`;
}

function renderListBody() {
  const body = document.getElementById('list-body');
  const summary = document.getElementById('list-summary');
  if (!body || !summary) return;

  document.querySelectorAll('#list-filter .filter-btn').forEach(b => b.classList.toggle('active', b.dataset.f === listFilter));
  const clr = document.getElementById('list-search-clear');
  if (clr) clr.style.display = listSearch ? '' : 'none';

  // 月份過濾
  let filtered = listFilter === '全部' ? allData : allData.filter(r => r['年月'] === listFilter);

  // 搜尋過濾（項目名稱 + 類別 + 備註）
  const q = listSearch.trim().toLowerCase();
  if (q) {
    filtered = filtered.filter(r => {
      const name = getItemName(r).toLowerCase();
      const cat  = (r['類別'] || '').toLowerCase();
      const note = (r['備註（可選：詳細說明或特殊情況）'] || r['備註'] || '').toLowerCase();
      return name.includes(q) || cat.includes(q) || note.includes(q);
    });
  }
  const sorted = filtered.map(r => [new Date(r['日期']).getTime() || 0, r])
    .sort((a, b) => (b[0] - a[0]) || ((b[1]['__sheetRow']||0) - (a[1]['__sheetRow']||0)))
    .map(x => x[1]);

  // 統計列（有篩選或搜尋時置頂）
  const sumTWD = sorted.reduce((s, r) => s + (r['台幣金額'] || 0), 0);
  summary.innerHTML = (q || listFilter !== '全部')
    ? `<div class="list-sum-bar">
        <span style="font-size:11px;color:#93c5fd">📊 ${q ? '「' + esc(listSearch.trim()) + '」' : listFilter} · ${sorted.length} 筆</span>
        <span style="font-size:16px;font-weight:700;color:#f1f5f9;font-family:'DM Mono',monospace">NT$ ${fmt(sumTWD)}</span>
      </div>`
    : '';

  if (!sorted.length) {
    body.innerHTML = q ? '<div class="empty">🔍 找不到符合的記錄</div>' : '<div class="empty">這個月還沒有記錄</div>';
    return;
  }

  // 每日小計（以全部符合的資料計算，不受「先畫 100 筆」影響）
  const dayKey = r => r['年月'] + '-' + r['日'];
  const daySum = {};
  sorted.forEach(r => { const k = dayKey(r); daySum[k] = (daySum[k] || 0) + (r['台幣金額'] || 0); });

  let html = '', lastKey = null;
  sorted.slice(0, listLimit).forEach(r => {
    const k = dayKey(r);
    if (k !== lastKey) {
      if (lastKey !== null) html += '</div>';
      lastKey = k;
      const d = new Date(r['日期']);
      const wd = isNaN(d) ? '' : `（${WEEKDAY[d.getDay()]}）`;
      html += `<div class="day-group"><div class="day-head"><span>${fmtDate(r['日期'])}${wd}</span><span class="day-sum">${fmt(daySum[k])}</span></div>`;
    }
    html += listRowHTML(r);
  });
  html += '</div>';

  const rest = sorted.length - listLimit;
  html += rest > 0
    ? `<div class="list-caption" id="list-more" onclick="listLimit+=100;renderListBody()">載入更多（還有 ${rest} 筆）</div>`
    : (q || listFilter !== '全部' ? '' : `<div class="list-caption">共 ${sorted.length} 筆</div>`);
  body.innerHTML = html;

  // 捲到底自動載入下一批
  if (_listObs) { _listObs.disconnect(); _listObs = null; }
  const more = document.getElementById('list-more');
  if (more && 'IntersectionObserver' in window) {
    _listObs = new IntersectionObserver(es => {
      if (es.some(e => e.isIntersecting)) { listLimit += 100; renderListBody(); }
    }, { root: document.getElementById('content'), rootMargin: '300px' });
    _listObs.observe(more);
  }
}

function getItemName(r) {
  // 嘗試所有可能的欄位名稱
  const keys = Object.keys(r);
  const nameKey = keys.find(k => k.includes('項目') || k.includes('名稱') || k.includes('簡述'));
  return (nameKey ? r[nameKey] : '') || '';
}

function buildHistory() {
  // 從 allData 建立歷史紀錄，以項目名稱去重，保留最新的類別/幣別/支付
  const map = {};
  if (allData.length > 0) {
    const sampleKeys = Object.keys(allData[0]);
    console.log('buildHistory 欄位名稱:', sampleKeys);
  }
  [...allData].reverse().forEach(r => {
    // 嘗試所有可能的欄位名稱
    const name = (r['項目名稱（簡述）'] || r['項目名稱（簡述用途）'] || r['項目名稱'] || r['D'] || '').trim();
    if (!name) return;
    if (!map[name]) {
      map[name] = {
        name,
        category: r['類別'] || '',
        currency: r['幣別'] || '',
        payment:  r['支付方式'] || '',
        amount:   r['金額'] || '',
      };
    }
  });
  return Object.values(map);
}

function onNameInput(val) {
  const list = document.getElementById('ac-list');
  if (!val || val.length < 1) { list.style.display = 'none'; return; }
  const q = val.toLowerCase();
  const history = buildHistory();
  // DEBUG: 顯示資料狀況
  console.log('allData筆數:', allData.length, '歷史筆數:', history.length, '搜尋:', q);
  if (allData.length > 0) console.log('第一筆欄位:', Object.keys(allData[0]));
  const results = history
    .filter(h => h.name.toLowerCase().includes(q))
    .slice(0, 6);
  console.log('符合結果:', results.length, results.map(r=>r.name));
  if (!results.length) { list.style.display = 'none'; return; }

  // 動態定位到輸入框正下方
  const inputEl = document.getElementById('inp-name');
  const rect = inputEl.getBoundingClientRect();
  list.style.top = (rect.bottom + 4) + 'px';
  list.style.left = '12px';
  list.style.right = '12px';
  list.style.bottom = 'auto';
  list.innerHTML = results.map(h => {
    const hi = h.name.replace(new RegExp(val.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'gi'),
      m => `<span class="ac-highlight">${m}</span>`);
    const cur = h.currency.includes('VND') ? 'VND' : h.currency.includes('USD') ? 'USD' : 'TWD';
    return `<div class="autocomplete-item"
      data-name="${h.name.replace(/"/g,'&quot;')}"
      data-cat="${h.category}" data-cur="${cur}" data-pay="${h.payment}"
      onmousedown="selectACEl(this)" ontouchstart="selectACEl(this)">
      <span class="ac-name">${hi}</span>
      <span class="ac-meta">${h.category}<br>${cur} · ${h.payment}</span>
    </div>`;
  }).join('');
  list.style.display = 'block';
}


function selectACEl(el) {
  const name = el.getAttribute('data-name');
  const cat  = el.getAttribute('data-cat');
  const cur  = el.getAttribute('data-cur');
  const pay  = el.getAttribute('data-pay');
  document.getElementById('inp-name').value = name;
  document.getElementById('ac-list').style.display = 'none';
  if (cat) selCat = cat;
  if (cur) selCur = cur;
  if (pay) {
    const payMap = ['現金','信用卡','銀行轉帳'];
    const matched = payMap.find(k => pay.includes(k));
    selPay = matched || '';
  }
  initFormPills();
  updateTWD();
}

function hideAC() {
  setTimeout(() => {
    const list = document.getElementById('ac-list');
    if (list) list.style.display = 'none';
  }, 150);
}

// 點擊列表外任意位置，立即收合 autocomplete
document.addEventListener('pointerdown', e => {
  const list = document.getElementById('ac-list');
  if (!list || list.style.display === 'none') return;
  if (e.target.closest('#ac-list')) return;       // 點選項本身 → 交給 selectACEl
  if (e.target.id === 'inp-name') return;         // 點輸入框 → 保持開啟
  list.style.display = 'none';
}, true);

// 輪詢偵測輸入框值（解決中文輸入法不觸發 oninput 問題）
let _acLastVal = '';
function startACWatcher() {
  setInterval(() => {
    const el = document.getElementById('inp-name');
    if (!el || document.activeElement !== el) return;
    const val = el.value;
    if (val !== _acLastVal) {
      _acLastVal = val;
      onNameInput(val);
    }
  }, 200);
}

// ════════════════════════════════════
//  記帳分頁初始化
// ════════════════════════════════════
let selCat = ''; let selCur = 'VND'; let selPay = '';

function initForm() {
  // Autocomplete 事件綁定（支援中文輸入法）
  const nameEl = document.getElementById('inp-name');
  let acTimer = null;
  let isComposing = false;

  // 輪詢方式：每 300ms 檢查一次輸入值，最相容注音輸入法
  let lastVal = '';
  let pollTimer = null;

  function startPoll() {
    stopPoll();
    pollTimer = setInterval(() => {
      const v = nameEl.value;
      if (v !== lastVal) {
        lastVal = v;
        onNameInput(v);
      }
    }, 300);
  }

  function stopPoll() {
    if (pollTimer) { clearInterval(pollTimer); pollTimer = null; }
  }

  nameEl.addEventListener('focus', () => { lastVal = ''; startPoll(); });
  nameEl.addEventListener('blur', () => {
    stopPoll();
    setTimeout(hideAC, 300);
  });

  // 設定今天日期
  const today = new Date();
  const yyyy = today.getFullYear();
  const mm = String(today.getMonth()+1).padStart(2,'0');
  const dd = String(today.getDate()).padStart(2,'0');
  document.getElementById('inp-date').value = `${yyyy}-${mm}-${dd}`;

  // 類別
  const catContainer = document.getElementById('pills-cat');
  const cats = CATEGORIES;
  catContainer.innerHTML = cats.map(c => `
    <div class="pill ${c==='（未選）'&&!selCat?'selected':c===selCat?'selected':''}"
         onclick="selectPill('cat','${c}')">${c}</div>
  `).join('');

  // 幣別
  const curContainer = document.getElementById('pills-cur');
  curContainer.innerHTML = CURRENCIES.map(c => `
    <div class="pill ${c===selCur?'selected':''}" onclick="selectPill('cur','${c}')">${c}</div>
  `).join('');

  // 支付
  const payContainer = document.getElementById('pills-pay');
  const pays = PAYMENTS;
  payContainer.innerHTML = pays.map(p => `
    <div class="pill ${p==='（未選）'&&!selPay?'selected':p===selPay?'selected':''}"
         onclick="selectPill('pay','${p}')">${p}</div>
  `).join('');

  // 金額即時換算
  document.getElementById('inp-amt').addEventListener('input', updateTWD);
}

function selectPill(type, val) {
  // 再點一次已選的項目 = 取消選取
  if (type === 'cat') {
    selCat = val === selCat ? '' : val;
  } else if (type === 'cur') {
    selCur = val;
    updateTWD();
  } else if (type === 'pay') {
    selPay = val === selPay ? '' : val;
  }
  initFormPills();
}

function initFormPills() {
  // 只更新 pills，不重置其他欄位
  const catContainer = document.getElementById('pills-cat');
  if (catContainer) {
    const cats = CATEGORIES;
    catContainer.innerHTML = cats.map(c => `
      <div class="pill ${c==='（未選）'&&!selCat?'selected':c===selCat?'selected':''}"
           onclick="selectPill('cat','${c}')">${c}</div>
    `).join('');
  }
  const curContainer = document.getElementById('pills-cur');
  if (curContainer) {
    curContainer.innerHTML = CURRENCIES.map(c => `
      <div class="pill ${c===selCur?'selected':''}" onclick="selectPill('cur','${c}')">${c}</div>
    `).join('');
  }
  const payContainer = document.getElementById('pills-pay');
  if (payContainer) {
    const pays = PAYMENTS;
    payContainer.innerHTML = pays.map(p => `
      <div class="pill ${p==='（未選）'&&!selPay?'selected':p===selPay?'selected':''}"
           onclick="selectPill('pay','${p}')">${p}</div>
    `).join('');
  }
}

function updateTWD() {
  const hint = document.getElementById('amt-hint');
  if (!hint) return;
  const amt = parseFloat(document.getElementById('inp-amt').value) || 0;
  if (amt > 0 && selCur !== 'TWD') {
    const twd = selCur === 'VND' ? Math.round(amt * VND_RATE) : Math.round(amt * USD_RATE);
    hint.textContent = '≈ NT$ ' + fmt(twd);
  } else {
    hint.textContent = '';
  }
}

// 常用項目：近 90 天出現 2 次以上的項目，依次數排序取前 8
let _quickItems = [];
function renderQuickItems() {
  const box = document.getElementById('quick-items');
  if (!box) return;
  const cutoff = Date.now() - 90 * 86400000;
  const map = {};
  allData.forEach(r => {
    const name = getItemName(r).trim();
    if (!name) return;
    const t = new Date(r['日期']).getTime();
    if (!(t >= cutoff)) return;
    if (!map[name]) map[name] = { name, n: 0, last: -1, r };
    map[name].n++;
    if (t >= map[name].last) { map[name].last = t; map[name].r = r; }
  });
  _quickItems = Object.values(map).filter(x => x.n >= 2)
    .sort((a, b) => b.n - a.n || b.last - a.last).slice(0, 8);
  box.style.display = _quickItems.length ? '' : 'none';
  box.innerHTML = _quickItems.map((x, i) =>
    `<button type="button" class="quick-chip" onclick="applyQuickItem(${i})"><span class="lr-dot" style="background:${catColor(x.r['類別'])}"></span>${esc(x.name)}</button>`
  ).join('');
}

function applyQuickItem(i) {
  const x = _quickItems[i];
  if (!x) return;
  const r = x.r;
  document.getElementById('inp-name').value = x.name;
  _acLastVal = x.name;
  if (CATEGORIES.includes(r['類別'])) selCat = r['類別'];
  const cur = r['幣別'] || '';
  selCur = cur.includes('VND') ? 'VND' : cur.includes('USD') ? 'USD' : 'TWD';
  selPay = PAYMENTS.find(k => (r['支付方式'] || '').includes(k)) || '';
  initFormPills();
  updateTWD();
  const a = document.getElementById('inp-amt');
  if (!a.value) a.focus();
}

function clearForm() {
  selCat = ''; selCur = 'VND'; selPay = '';
  document.getElementById('inp-amt').value = '';
  document.getElementById('inp-name').value = '';
  document.getElementById('inp-note').value = '';
  removeFile();
  initForm();
  updateTWD();
  renderQuickItems();
}

function openEditModal(r) {
  editRow = r;
  editSelCat = r['類別'] || '';
  const curRaw = r['幣別'] || '';
  editSelCur = curRaw.includes('VND') ? 'VND' : curRaw.includes('USD') ? 'USD' : 'TWD';
  editSelPay = r['支付方式'] || '';
  // 移除 (Wallet/Pocket...) 等括號內容
  if (editSelPay.includes('（') || editSelPay.includes('(')) {
    editSelPay = editSelPay.split(/[（(]/)[0].trim();
  }

  document.getElementById('edit-date').value = r['日期'] || '';
  document.getElementById('edit-amt').value  = r['金額'] || '';
  document.getElementById('edit-name').value = getItemName(r) || '';
  const noteVal = r['備註（可選：詳細說明或特殊情況）'] || r['備註'] || '';
  document.getElementById('edit-note').value = noteVal;

  // 重置上傳區
  removeEditFile();

  // 若備註已含收據連結，顯示現有連結
  const existEl = document.getElementById('edit-existing-receipt');
  const existLink = document.getElementById('edit-existing-link');
  const receiptMatch = noteVal.match(/📎 收據：(https?:\/\/\S+)/);
  if (receiptMatch) {
    existEl.style.display = 'block';
    existLink.innerHTML = `已有收據：<a href="${receiptMatch[1]}" target="_blank" style="color:#60a5fa">查看 →</a>`;
  } else {
    existEl.style.display = 'none';
    existLink.innerHTML = '';
  }

  renderEditPills();
  document.getElementById('edit-modal').style.display = 'flex';
}

function renderEditPills() {

  document.getElementById('edit-pills-cat').innerHTML = cats.map(c =>

      onclick="editSelCat='${c==='（未選）'?'':c}';renderEditPills()">${c}</div>`

async function saveEdit() {
  if (!editRow) return;
  let note = document.getElementById('edit-note').value.trim();

  // 若有新選取的檔案，先上傳
  if (editSelectedFile) {
    const saveBtn = document.querySelector('#edit-modal .btn-primary');
    saveBtn.textContent = '📤 上傳中...';
    saveBtn.disabled = true;
    try {
      const fileUrl = await uploadEditFileToDrive(editSelectedFile, editRow['__sheetRow'] || Date.now());
      // 移除舊收據連結再加新的
      note = note.replace(/\n?📎 收據：https?:\/\/\S+/, '');
      note = (note ? note + '\n' : '') + '📎 收據：' + fileUrl;
    } catch(uploadErr) {
      showToast('⚠️ 收據上傳失敗', 'err');
    } finally {
      saveBtn.textContent = '💾 儲存';
      saveBtn.disabled = false;
    }
  }

  const eAmt = parseFloat(document.getElementById('edit-amt').value) || 0;
  const twd = editSelCur === 'VND' ? Math.round(eAmt * VND_RATE) : editSelCur === 'USD' ? Math.round(eAmt * USD_RATE) : Math.round(eAmt);

  const payload = {
    action:     'update',
    rowNumber:  editRow['__sheetRow'] || '',
    timestamp:  editRow['__rawTimestamp'] || editRow['時間戳記'] || '',
    date:       document.getElementById('edit-date').value,
    category:   editSelCat,
    item:       document.getElementById('edit-name').value.trim(),
    amount:     eAmt,
    currency:   CUR_LABEL[editSelCur] || editSelCur,
    payment:    editSelPay,
    note:       note,
    twd:        twd,
  };
  console.log('💾 saveEdit payload:', JSON.stringify(payload));

  // ── 樂觀更新本地資料，立即關窗渲染 ──
  const row = editRow; // closeEditModal 會清空 editRow，先留參照
  row['日期'] = payload.date;
  row['類別'] = payload.category;
  row['金額'] = String(eAmt);
  row['幣別'] = payload.currency;
  row['支付方式'] = payload.payment;
  row['備註（可選：詳細說明或特殊情況）'] = note;
  row['備註'] = note;
  row['台幣金額'] = twd;
  row['__twdStored'] = true;
  const nk = Object.keys(row).find(k => k.includes('項目') || k.includes('名稱') || k.includes('簡述'));
  if (nk) row[nk] = payload.item;
  const nd = new Date(payload.date);
  if (!isNaN(nd)) {
    row['年月'] = `${nd.getFullYear()}-${String(nd.getMonth()+1).padStart(2,'0')}`;
    row['日'] = nd.getDate();
  }
  showToast('✅ 已更新！', 'ok');
  closeEditModal();
  renderCurrentTab();

  // ── 背景送出 + 同步驗證 ──
  submitViaForm(payload).then(async () => {
    await loadData();
    renderCurrentTab();
  });
}

async function confirmDelete() {
  if (!editRow) return;
  if (!confirm('確定要刪除這筆記錄嗎？')) return;
  const payload = {
    action:    'delete',
    rowNumber: editRow['__sheetRow'] || '',

  };
  console.log('🗑️ confirmDelete payload:', JSON.stringify(payload));

  });
}

function getHiddenIframe() {
  let iframe = document.getElementById('hidden-submit-frame');
  if (!iframe) {
    iframe = document.createElement('iframe');
    iframe.id = 'hidden-submit-frame';
    iframe.name = 'hidden-submit-frame';
    iframe.style.display = 'none';
    document.body.appendChild(iframe);
  }
  return iframe;
}

// 送出 hidden form，等 iframe onload（GAS 回應）即 resolve，最多等 8 秒
function submitViaForm(payload) {
  return new Promise(resolve => {
    const iframe = getHiddenIframe();
    let done = false;
    const finish = ok => {
      if (done) return;
      done = true;
      iframe.removeEventListener('load', onload);
      resolve(ok);
    };
    const onload = () => finish(true);
    iframe.addEventListener('load', onload);
    setTimeout(() => finish(false), 8000);
    const form = buildHiddenForm(payload);
    document.body.appendChild(form);
    form.submit();
    document.body.removeChild(form);
  });
}

function buildHiddenForm(payload) {
  const form = document.createElement('form');
  form.method = 'POST';
  form.action = WEBHOOK;
  form.target = 'hidden-submit-frame';
  form.style.display = 'none';
  for (const [k, v] of Object.entries(payload)) {
    const input = document.createElement('input');
    input.type = 'hidden'; input.name = k; input.value = v;
    form.appendChild(input);
  }
  return form;
}

async function submitForm() {
  const date = document.getElementById('inp-date').value;
  const amt  = parseFloat(document.getElementById('inp-amt').value) || 0;
  const name = document.getElementById('inp-name').value.trim();
  const note = document.getElementById('inp-note').value.trim();

  if (!amt)    { showToast('❌ 請輸入金額', 'err'); return; }
  if (!selCat) { showToast('❌ 請選擇類別', 'err'); return; }

  const btn = document.querySelector('.btn-primary');
  btn.textContent = '⏳ 送出中...';
  btn.disabled = true;

  const ts = new Date().toLocaleString('zh-TW', {timeZone:'Asia/Taipei'})
    .replace(/\//g,'/').replace(/,/,' ');

  const payload = {
    timestamp: ts,
    date:      date,
    category:  selCat,
    item:      name,
    amount:    amt,
    currency:  CUR_LABEL[selCur] || selCur,
    payment:   selPay,
    note:      note,
  };

  // 記帳當下的台幣金額（匯率固定，寫入 Sheets J 欄）
  const twd = selCur === 'VND' ? Math.round(amt * VND_RATE) : selCur === 'USD' ? Math.round(amt * USD_RATE) : Math.round(amt);
  payload.twd = twd;

  try {
    // 如果有選取檔案，先上傳到 Drive
    if (selectedFile) {
      btn.textContent = '📤 上傳收據...';
      try {
        const fileUrl = await uploadFileToDrive(selectedFile, ts);
        payload.note = (note ? note + '\n' : '') + '📎 收據：' + fileUrl;
      } catch(uploadErr) {
        showToast('⚠️ 收據上傳失敗，僅送出記帳', 'err');
        payload.note = note;
      }
    }

    // ── 立即顯示，背景寫入；寫入與否以 Sheets 實際出現為準 ──
    queueTx(payload);
    showToast('✅ 已記帳', 'ok');
    clearForm();
    renderCurrentTab();
  } catch(e) {
    showToast('❌ 記帳失敗：' + e.message, 'err');
  } finally {
    btn.textContent = '✅ 提交記帳';
    btn.disabled = false;
  }
}

async function uploadFileToDrive(file, timestamp) {
  // 圖片壓縮
  async function compressImage(f) {
    return new Promise((res) => {
      if (!f.type.startsWith('image/')) { res(f); return; }
      const img = new Image();
      const url = URL.createObjectURL(f);
      img.onload = () => {
        const MAX = 800;
        let w = img.width, h = img.height;
        if (w > MAX || h > MAX) {
          if (w > h) { h = Math.round(h * MAX / w); w = MAX; }
          else { w = Math.round(w * MAX / h); h = MAX; }
        }
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        canvas.toBlob(blob => res(new File([blob], f.name, {type:'image/jpeg'})), 'image/jpeg', 0.7);
        URL.revokeObjectURL(url);
      };
      img.onerror = () => res(f);
      img.src = url;
    });
  }

  const prog = document.getElementById('upload-progress');
  const fill = document.getElementById('progress-fill');
  const text = document.getElementById('progress-text');
  if (prog) prog.style.display = 'block';
  if (fill) fill.style.width = '20%';
  if (text) text.textContent = '壓縮中...';

  const compressed = await compressImage(file);

  if (fill) fill.style.width = '40%';
  if (text) text.textContent = '上傳中...';

  // 用 Cloudinary 免費圖片託管（unsigned upload）
  const CLOUD_NAME = 'democloud';  // 會在設定頁填入
  const UPLOAD_PRESET = 'ml_default';
  const cloudName = localStorage.getItem('cloudinary_name') || '';
  const uploadPreset = localStorage.getItem('cloudinary_preset') || '';

  if (!cloudName) {
    if (prog) prog.style.display = 'none';
    throw new Error('請先在設定頁填入 Cloudinary Cloud Name');
  }

  const formData = new FormData();
  formData.append('file', compressed);
  formData.append('upload_preset', uploadPreset || 'ml_default');
  formData.append('folder', 'receipts');

  const resp = await fetch(`https://api.cloudinary.com/v1_1/${cloudName}/image/upload`, {
    method: 'POST',
    body: formData
  });

  if (fill) fill.style.width = '90%';
  const result = await resp.json();
  console.log('Cloudinary result:', result);

  if (fill) fill.style.width = '100%';
  if (text) text.textContent = result.secure_url ? '✅ 上傳成功！' : '❌ 上傳失敗';
  setTimeout(() => { if (prog) prog.style.display = 'none'; if (fill) fill.style.width = '0%'; }, 1500);

  if (result.secure_url) return result.secure_url;
  throw new Error(result.error?.message || '上傳失敗');
}


async function uploadEditFileToDrive(file, rowNum) {
  // 複用 uploadFileToDrive 的壓縮上傳邏輯
  const prog = document.getElementById('edit-upload-progress');
  const fill = document.getElementById('edit-progress-fill');
  const text = document.getElementById('edit-progress-text');
  if (prog) prog.style.display = 'block';

  // 替換進度條 ID 讓 uploadFileToDrive 可以更新
  const origIds = {};
  ['upload-progress','progress-fill','progress-text'].forEach((id, i) => {
    const editId = ['edit-upload-progress','edit-progress-fill','edit-progress-text'][i];
    const el = document.getElementById(editId);
    if (el) { origIds[id] = el.id; el.id = id; }
  });

  try {
    const fileName = 'edit-row' + rowNum + '_' + file.name;
    // 建立新的 File 物件用新檔名
    const renamedFile = new File([file], fileName, { type: file.type });
    const ts = String(rowNum);
    const url = await uploadFileToDrive(renamedFile, ts);
    return url;
  } finally {
    // 還原 ID
    Object.entries(origIds).forEach(([id, origId]) => {
      const el = document.getElementById(id);
      if (el) el.id = origId;
    });
  }
}

let reimburseFilter = 'unpaid'; // 'all' | 'unpaid' | 'paid'

function renderReimburse() {
  const page = document.getElementById('page-reimburse');
  const rows = allData.filter(r => r['類別'] && r['類別'].includes('公司代墊'));

  if (!rows.length) {
    page.innerHTML = '<div class="empty">📭 尚無公司代墊紀錄</div>';
    return;
  }

  const unpaidRows = rows.filter(r => !r['收款狀態'] || r['收款狀態'] === '' || r['收款狀態'] === '未收款');
  const paidRows   = rows.filter(r => r['收款狀態'] === '已收款');
  const unpaidSum  = unpaidRows.reduce((s, r) => s + r['台幣金額'], 0);
  const paidSum    = paidRows.reduce((s, r) => s + r['台幣金額'], 0);

  // 分幣別加總
  function sumByCur(arr) {
    const m = {};
    arr.forEach(r => {
      const cur = (r['幣別']||'').includes('VND') ? 'VND' : (r['幣別']||'').includes('USD') ? 'USD' : 'TWD';
      m[cur] = (m[cur]||0) + (parseFloat(r['金額'])||0);
    });
    return m;
  }
  const unpaidByCur = sumByCur(unpaidRows);
  const paidByCur   = sumByCur(paidRows);

  function renderCurLines(map) {
    return Object.entries(map).map(([cur, amt]) => {
      if (cur === 'VND') return `<div class="rs-cur">₫ ${Math.round(amt).toLocaleString()}</div>`;
      if (cur === 'USD') return `<div class="rs-cur">$ ${amt.toLocaleString()}</div>`;
      return `<div class="rs-cur">NT$ ${Math.round(amt).toLocaleString()}</div>`;
    }).join('');
  }

  const filterRows = reimburseFilter === 'unpaid' ? unpaidRows
                   : reimburseFilter === 'paid'   ? paidRows
                   : rows;

  page.innerHTML = `
    <div class="reimburse-header">
      <div class="reimburse-summary">
        <div class="rs-card unpaid">
          <div class="rs-label">⏳ 未收款</div>
          <div class="rs-amt">≈ NT$ ${fmt(unpaidSum)}</div>
          ${renderCurLines(unpaidByCur)}
          <div class="rs-count">${unpaidRows.length} 筆</div>
        </div>
        <div class="rs-card paid">
          <div class="rs-label">✅ 已收款</div>
          <div class="rs-amt">≈ NT$ ${fmt(paidSum)}</div>
          ${renderCurLines(paidByCur)}
          <div class="rs-count">${paidRows.length} 筆</div>
        </div>
      </div>
      <div class="reimburse-filter">
        <button class="rf-btn ${reimburseFilter==='unpaid'?'active':''}" onclick="setRFilter('unpaid')">未收款</button>
        <button class="rf-btn ${reimburseFilter==='paid'?'active':''}" onclick="setRFilter('paid')">已收款</button>
        <button class="rf-btn ${reimburseFilter==='all'?'active':''}" onclick="setRFilter('all')">全部</button>
      </div>
    </div>
    <div class="reimburse-list">
      ${filterRows.length === 0 ? '<div class="empty">📭 無符合紀錄</div>' :
        filterRows.map(r => {
          const isPaid = r['收款狀態'] === '已收款';
          const sheetRow = r['__sheetRow'] || '';
          return `
          <div class="reimburse-item ${isPaid ? 'is-paid' : ''}">
            <label class="reimburse-check">
              <input type="checkbox" ${isPaid ? 'checked' : ''}
                onchange="toggleReimburse(this, '${sheetRow}', '${(r['__rawTimestamp']||'').replace(/'/g,"\'")}')">
              <span class="checkmark"></span>
            </label>
            <div class="reimburse-info">
              <div class="ri-date">${fmtDate(r['日期'])}</div>
              <div class="ri-name ${isPaid ? 'ri-paid-name' : ''}">${getItemName(r) || '（無名稱）'}</div>
              <div class="ri-meta">${r['幣別']||''} ${parseFloat(r['金額']||0).toLocaleString()} ${r['支付方式']||''}</div>
            </div>
            <div class="reimburse-amt">
              ${(() => {
                const cur = (r['幣別']||'');
                const amt = parseFloat(r['金額'])||0;
                if (cur.includes('VND')) return `<div class="ri-orig">₫ ${Math.round(amt).toLocaleString()}</div><div class="ri-twd">≈ NT$ ${fmt(r['台幣金額'])}</div>`;
                if (cur.includes('USD')) return `<div class="ri-orig">$ ${amt.toLocaleString()}</div><div class="ri-twd">≈ NT$ ${fmt(r['台幣金額'])}</div>`;
                return `<div class="ri-twd">NT$ ${fmt(r['台幣金額'])}</div>`;
              })()}
              ${isPaid ? '<div class="ri-paid-badge">已收款</div>' : ''}
            </div>
          </div>`;
        }).join('')
      }
    </div>`;
}

function setRFilter(f) {
  reimburseFilter = f;
  renderReimburse();
}

async function toggleReimburse(checkbox, sheetRow, timestamp) {
  const isPaid = checkbox.checked;
  const status = isPaid ? '已收款' : '未收款';

  // ── 樂觀更新：立即改本地狀態並渲染 ──
  const row = allData.find(r => r['__sheetRow'] == sheetRow);
  if (row && row['__pending']) {
    checkbox.checked = !isPaid;
    showToast('⚠️ 這筆尚未寫入 Sheets，暫時不能勾選', 'err');
    return;
  }
  if (row) row['收款狀態'] = status;
  showToast(isPaid ? '✅ 已標記收款！' : '↩️ 已取消收款', 'ok');
  renderReimburse();

  // ── 背景送出 + 同步驗證 ──
  submitViaForm({
    action:     'update',
    rowNumber:  sheetRow,
    timestamp:  timestamp,
    reimbursed: status,
  }).then(async () => {
    await loadData();
    if (currentTab === 'reimburse') renderReimburse();
  });
}


// 日期顯示：2026年後只顯示月/日，其他年份顯示完整
function fmtDate(dateStr) {
  if (!dateStr) return '';
  const d = new Date(dateStr);
  if (isNaN(d)) return dateStr;
  const y = d.getFullYear();
  const m = d.getMonth() + 1;
  const day = d.getDate();
  const curYear = new Date().getFullYear();
  if (y === curYear) return `${m}/${day}`;
  return `${y}/${m}/${day}`;
}

// 收據辨識
async function triggerAIScan() {
  if (!selectedFile) return;
  if (GEMINI_KEY.includes('填入')) {
    showToast('❌ 請先在程式碼填入 Gemini API Key', 'err');
    return;
  }

  const btn = document.getElementById('ai-scan-btn');
  btn.textContent = '⏳ 辨識中...';
  btn.disabled = true;

  // 移除舊結果
  const old = document.getElementById('ai-result-card');
  if (old) old.remove();

  try {
    // 轉 base64
    const base64 = await new Promise((res, rej) => {
      const reader = new FileReader();
      reader.onload = e => res(e.target.result.split(',')[1]);
      reader.onerror = rej;
      reader.readAsDataURL(selectedFile);
    });

    const prompt = `這是一張收據或帳單照片。請辨識並以 JSON 格式回傳以下資訊（只回傳 JSON，不要其他文字）：
{
  "item": "消費項目名稱（簡短）",
  "amount": 數字（金額，不含幣別符號）,
  "currency": "TWD 或 VND 或 USD",
  "category": "從以下選一：食/住/行/育/樂/醫療/保險、稅/固定/越南固定/公司代墊/人情往來/金融費用/其他（紅包、白包、送禮、請客→人情往來；利息、手續費、年費→金融費用）",
  "date": "日期 yyyy-mm-dd 格式，若無法辨識則空字串",
  "note": "補充備註（可空）"
}`;

    const resp = await fetch(
      `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=${GEMINI_KEY}`,
      {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          contents: [{
            parts: [
              { text: prompt },
              { inline_data: { mime_type: selectedFile.type || 'image/jpeg', data: base64 } }
            ]
          }]
        })
      }
    );

    const data = await resp.json();
    const text = data.candidates?.[0]?.content?.parts?.[0]?.text || '';
    const clean = text.replace(/```json|```/g, '').trim();
    const result = JSON.parse(clean);

    // 顯示辨識結果卡片
    const uploadWrap = document.getElementById('upload-area').parentElement;
    const card = document.createElement('div');
    card.id = 'ai-result-card';
    card.className = 'ai-result-card';
    card.innerHTML = `
      <div style="font-size:12px;color:#6366f1;font-weight:600;margin-bottom:6px">🤖 AI 辨識結果</div>
      ${result.item    ? `<div class="ai-result-row"><span class="ai-result-label">項目</span><span class="ai-result-val">${result.item}</span></div>` : ''}
      ${result.amount  ? `<div class="ai-result-row"><span class="ai-result-label">金額</span><span class="ai-result-val">${result.amount} ${result.currency||''}</span></div>` : ''}
      ${result.category? `<div class="ai-result-row"><span class="ai-result-label">類別</span><span class="ai-result-val">${result.category}</span></div>` : ''}
      ${result.date    ? `<div class="ai-result-row"><span class="ai-result-label">日期</span><span class="ai-result-val">${result.date}</span></div>` : ''}
      ${result.note    ? `<div class="ai-result-row"><span class="ai-result-label">備註</span><span class="ai-result-val">${result.note}</span></div>` : ''}
      <button class="ai-apply-btn" onclick="applyAIResult(${JSON.stringify(result).replace(/"/g,'&quot;')})">✅ 套用到記帳欄位</button>
    `;
    uploadWrap.appendChild(card);
    showToast('✅ 辨識完成！', 'ok');

  } catch(e) {
    console.error('AI scan error:', e);
    showToast('❌ 辨識失敗：' + e.message, 'err');
  } finally {
    btn.textContent = '🤖 AI辨識';
    btn.disabled = false;
  }
}

function applyAIResult(result) {
  if (result.item)     document.getElementById('inp-name').value = result.item;
  if (result.amount)   { document.getElementById('inp-amt').value = result.amount; updateTWD(); }
  if (result.date)     document.getElementById('inp-date').value = result.date;
  if (result.note)     document.getElementById('inp-note').value = result.note;
  if (result.category && CATEGORIES.includes(result.category)) {
    selCat = result.category; initFormPills();
  }
  if (result.currency) {
    const cur = result.currency.toUpperCase();
    if (CURRENCIES.includes(cur)) { selCur = cur; initFormPills(); }
  }
  showToast('✅ 已套用辨識結果！', 'ok');
  const card = document.getElementById('ai-result-card');
  if (card) card.remove();
}

// 消費分析
async function openAnalysis() {
  if (!OPENAI_KEY) {
    showToast('❌ 請先在設定頁填入 OpenAI API Key', 'err');
    return;
  }
  document.getElementById('analysis-modal').style.display = 'flex';
  const el = document.getElementById('analysis-content');
  el.innerHTML = '<div class="analysis-loading">🤖 分析中，請稍候...</div>';

  try {
    const today = new Date();
    const curYM = `${today.getFullYear()}-${String(today.getMonth()+1).padStart(2,'0')}`;
    const thisMonth = allData.filter(r => r['年月'] === curYM && !CO_KEYS.includes(r['類別']||''));
    const last3 = allData.filter(r => r['年月'] < curYM && !CO_KEYS.includes(r['類別']||''));

    // 整理資料摘要給 Gemini
    const catSum = {};
    thisMonth.forEach(r => {
      const c = r['類別'] || '其他';
      catSum[c] = (catSum[c]||0) + r['台幣金額'];
    });
    const total = Object.values(catSum).reduce((a,b)=>a+b,0);
    const summary = Object.entries(catSum).sort((a,b)=>b[1]-a[1])
      .map(([c,v]) => `${c}: NT$${Math.round(v).toLocaleString()}（${(v/total*100).toFixed(1)}%）`).join('\n');

    const prev3months = [...new Set(last3.map(r=>r['年月']))].sort().reverse().slice(0,3);
    const prevAvg = prev3months.length ? Math.round(
      prev3months.map(mo => last3.filter(r=>r['年月']===mo).reduce((s,r)=>s+r['台幣金額'],0))
        .reduce((a,b)=>a+b,0) / prev3months.length
    ) : 0;

    const prompt = `你是一位理財顧問。以下是用戶本月（${curYM}）的消費資料：

本月個人總支出：NT$${Math.round(total).toLocaleString()}
前3個月平均：NT$${prevAvg.toLocaleString()}
本月天數進度：${today.getDate()}/${new Date(today.getFullYear(), today.getMonth()+1, 0).getDate()}天

各類別消費：
${summary}

請用繁體中文提供：
1. 本月消費概況評估（2-3句）
2. 主要支出類別分析（重點2-3點）
3. 與前3月比較（是否有異常）
4. 具體節流建議（2-3點）

請簡潔有重點，總字數約200字。`;

    const resp = await fetch('https://api.openai.com/v1/chat/completions', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': 'Bearer ' + OPENAI_KEY,
      },
      body: JSON.stringify({
        model: 'gpt-4o-mini',
        messages: [{ role: 'user', content: prompt }],
        max_tokens: 800,
      })
    });
    const data = await resp.json();
    if (data.error) {
      // 顯示 OpenAI 回傳的真實錯誤（key 無效 / 額度用完等）
      el.innerHTML = `<div style="color:#ef4444">❌ OpenAI 錯誤：${data.error.message || JSON.stringify(data.error)}</div>`;
      return;
    }
    const text = data.choices?.[0]?.message?.content || '無法取得分析結果';
    el.innerHTML = `<div class="analysis-content">${text.replace(/\n/g,'<br>').replace(/\*\*/g,'<strong>').replace(/\*/g,'')}</div>`;

  } catch(e) {
    el.innerHTML = `<div style="color:#ef4444">❌ 分析失敗：${e.message}</div>`;
  }
}

function closeAnalysis() {
  document.getElementById('analysis-modal').style.display = 'none';
}

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js?v=476').catch(() => {});

    // 強制更新：偵測新版 SW 後立即接管
    navigator.serviceWorker.ready.then(reg => {
      reg.addEventListener('updatefound', () => {
        const newWorker = reg.installing;
        newWorker.addEventListener('statechange', () => {
          if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
            // 有新版本，強制刷新
            newWorker.postMessage({ type: 'SKIP_WAITING' });
            window.location.reload();
          }
        });
      });
    });
  });

  // 當 SW 切換完成，重新載入頁面
  let refreshing = false;
  navigator.serviceWorker.addEventListener('controllerchange', () => {
    if (!refreshing) { refreshing = true; window.location.reload(); }
  });
}

document.addEventListener('DOMContentLoaded', async () => {
  document.getElementById('ver-badge').textContent = VERSION;
  initForm();
  startACWatcher();
  const rateEl = document.getElementById('rate-badge');
  if (rateEl) rateEl.textContent = '匯率載入中...';

  // ── 先用上次快取的 CSV 秒開畫面 ──
  const cached = localStorage.getItem('cached_csv');
  if (cached) {
    try { allData = parseCSV(cached); mergePending(); renderQuickItems(); renderCurrentTab(); } catch(e) {}
  }

  // ── 背景抓最新資料 ──
  await loadData();
  // 上次關閉前還沒確認寫入的，載入後仍不在 Sheets → 標成未寫入
  if (pendingTx.some(p => !p.sending && !p.failed)) {
    pendingTx.forEach(p => { if (!p.sending) p.failed = true; });
    savePending();
    mergePending();
  }
  renderCurrentTab();

  fetchExchangeRate().then(() => {
    // 匯率抓到後，只重算「沒有已存台幣金額」的舊資料
    if (allData.length) {
      allData.forEach(r => {
        if (r['__twdStored']) return; // 記帳當下已固定匯率，不重算
        const amt = parseFloat(r['金額']) || 0;
        const cur = r['幣別'] || '';
        r['台幣金額'] = cur.includes('VND') ? Math.round(amt * VND_RATE) : cur.includes('USD') ? Math.round(amt * USD_RATE) : Math.round(amt);
      });
      renderCurrentTab();
    }
  });
});
